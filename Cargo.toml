[package]
name = "rabbagast"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
chrono = { version = "0.4.45", features = ["unstable-locales"] }
glib = "0.22.11"
gtk4 = "0.11"
gtk4-layer-shell = "0.8.1"
serde = { version= "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
